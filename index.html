<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Review The Bafna Furniture</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 440px;
      width: 100%;
      padding: 24px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .stars {
      color: #f59e0b;
      font-size: 26px;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 20px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 4px;
    }

    p.sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 18px;
      line-height: 1.45;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font-size: 13px;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.45;
    }

    .option-btn:hover,
    .option-btn.selected {
      background: #eff6ff;
      border-color: #2563eb;
      color: #1e40af;
      font-weight: 500;
    }

    .option-btn strong {
      font-weight: 700;
    }

    .submit-btn {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 12px;
      line-height: 1.5;
    }

    .language-note {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
    }

    @media (max-width: 360px) {
      .card {
        padding: 19px;
      }

      .option-btn {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="badge">
      40+ Years of Trust
    </div>

    <div class="stars">
      ★★★★★
    </div>

    <h1>
      The Bafna Furniture
    </h1>

    <p class="sub">
      Tap an option below, then copy & paste on Google:
    </p>


    <div class="options">

      <!-- ENGLISH 1 -->

      <button
        class="option-btn selected"
        onclick="selectOption(
          this,
          'Bought furniture from Bafna Furniture. Quality is good and the price was also reasonable. Overall happy with the purchase.'
        )">

        ⭐ <strong>Good Quality & Price:</strong><br>

        "Bought furniture from Bafna Furniture.
        Quality is good and the price was also reasonable.
        Overall happy with the purchase."

      </button>


      <!-- ENGLISH 2 -->

      <button
        class="option-btn"
        onclick="selectOption(
          this,
          'They have a good collection of wooden and steel furniture. Staff was helpful and showed us different options. Good experience overall.'
        )">

        🛋️ <strong>Collection & Staff:</strong><br>

        "They have a good collection of wooden and steel furniture.
        Staff was helpful and showed us different options.
        Good experience overall."

      </button>


      <!-- ENGLISH 3 -->

      <button
        class="option-btn"
        onclick="selectOption(
          this,
          'Got good quality furniture at a reasonable price. The furniture feels sturdy and the overall experience was good.'
        )">

        🏬 <strong>Durable & Affordable:</strong><br>

        "Got good quality furniture at a reasonable price.
        The furniture feels sturdy and the overall experience was good."

      </button>


      <!-- MARATHI 1 -->

      <button
        class="option-btn"
        onclick="selectOption(
          this,
          'बाफना फर्निचरमधून फर्निचर घेतले होते. क्वालिटी चांगली होती आणि दरही योग्य होते. खरेदीचा अनुभव छान आला.'
        )">

        🚩 <strong>मराठी (दर्जा व दर):</strong><br>

        "बाफना फर्निचरमधून फर्निचर घेतले होते.
        क्वालिटी चांगली होती आणि दरही योग्य होते.
        खरेदीचा अनुभव छान आला."

      </button>


      <!-- MARATHI 2 -->

      <button
        class="option-btn"
        onclick="selectOption(
          this,
          'लाकडी आणि स्टील फर्निचरचे कलेक्शन चांगले आहे. फर्निचर घेताना स्टाफनेही व्यवस्थित मदत केली. एकूण अनुभव चांगला आला.'
        )">

        🚩 <strong>मराठी (कलेक्शन व सेवा):</strong><br>

        "लाकडी आणि स्टील फर्निचरचे कलेक्शन चांगले आहे.
        फर्निचर घेताना स्टाफनेही व्यवस्थित मदत केली.
        एकूण अनुभव चांगला आला."

      </button>


      <!-- MARATHI 3 -->

      <button
        class="option-btn"
        onclick="selectOption(
          this,
          'बाफना फर्निचरमधून फर्निचर घेतले होते. क्वालिटी आणि मजबुती चांगली आहे. दरही योग्य होते. एकूणच अनुभव चांगला आला.'
        )">

        🚩 <strong>मराठी (क्वालिटी व मजबुती):</strong><br>

        "बाफना फर्निचरमधून फर्निचर घेतले होते.
        क्वालिटी आणि मजबुती चांगली आहे.
        दरही योग्य होते.
        एकूणच अनुभव चांगला आला."

      </button>

    </div>


    <button
      class="submit-btn"
      id="goBtn"
      onclick="copyAndRedirect()">

      Copy & Open Google Review

    </button>


    <p class="hint" id="hint">
      📋 Text copies automatically — then paste it on Google
      and give your genuine rating.
    </p>

    <p class="language-note">
      मराठी आणि English दोन्ही पर्याय उपलब्ध आहेत.
    </p>

  </div>


  <script>

    const GOOGLE_REVIEW_URL =
      "https://g.page/r/CXtSAphdamhgEBM/review";


    let selectedText =
      "Bought furniture from Bafna Furniture. Quality is good and the price was also reasonable. Overall happy with the purchase.";


    function selectOption(btn, text) {

      document
        .querySelectorAll(".option-btn")
        .forEach(function(button) {
          button.classList.remove("selected");
        });

      btn.classList.add("selected");

      selectedText = text;

    }


    async function copyAndRedirect() {

      const button =
        document.getElementById("goBtn");

      const hint =
        document.getElementById("hint");


      button.disabled = true;

      button.textContent =
        "📋 Copying...";


      try {

        await navigator.clipboard.writeText(
          selectedText
        );


        hint.textContent =
          "✓ Review copied! Opening Google...";


        setTimeout(function() {

          window.location.href =
            GOOGLE_REVIEW_URL;

        }, 500);


      } catch (error) {

        console.error(
          "Clipboard error:",
          error
        );


        hint.innerHTML =
          "📋 Automatic copy unavailable.<br>" +
          "Please copy the review manually.";


        button.disabled = false;

        button.textContent =
          "Open Google Review";

      }

    }

  </script>

</body>
</html>
